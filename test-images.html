            padding: 10px 20px;

            border: none;

            cursor: pointer;

        }

            margin: 15px 0; 
            padding: 15px; 
            border: 2px solid #333; 
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .working { 
            background: #1a2e1a; 
            border-color: #4ADE80;
        }
        .broken { 
            background: #2e1a1a; 
            border-color: #F87171;
        }
        
        .country-info {
            flex: 1;
        }
        .country-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .country-url {
            font-size: 12px;
            color: #999;
            word-break: break-all;
        }
        
        img { 
            width: 300px; 
            height: 150px; 
            object-fit: cover; 
            display: block;
            border-radius: 5px;
        }
        
        .status { 
            font-weight: bold;
            font-size: 16px;
            padding: 5px 15px;
            border-radius: 5px;
        }
        .working .status { 
            background: #4ADE80; 
            color: black; 
        }
        .broken .status { 
            background: #F87171; 
            color: white; 
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }
    </style>
</head>

        const resultsDiv = document.getElementById('results');
        const summaryDiv = document.getElementById('summary');
        const filtersDiv = document.getElementById('filters');
        
        const countries = Object.keys(COUNTRY_IMAGES);
        let working = 0;
        let broken = 0;
        let tested = 0;
        const total = countries.length;

        let currentFilter = 'all';

        countries.forEach(country => {
            const url = COUNTRY_IMAGES[country];
            const div = document.createElement('div');
            div.className = 'country-test';
            div.dataset.country = country;
            
            div.innerHTML = `
                <img id="img-${country.replace(/\s/g, '-')}" src="${url}" alt="${country}">
                <div class="country-info">
                    <div class="country-name">${country}</div>
                    <div class="country-url">${url}</div>
                </div>
                <div class="status" id="status-${country.replace(/\s/g, '-')}">Testing...</div>
            `;
            resultsDiv.appendChild(div);

            const img = document.getElementById(`img-${country.replace(/\s/g, '-')}`);
            const status = document.getElementById(`status-${country.replace(/\s/g, '-')}`);

            img.onload = function() {
                div.classList.add('working');
                status.textContent = '✓ Working';
                working++;
                tested++;
                updateSummary();
            };

            img.onerror = function() {
                div.classList.add('broken');
                status.textContent = '✗ Broken';
                broken++;
                tested++;
                updateSummary();
            };
        });

        function updateSummary() {
            const workingPercent = Math.round((working/total)*100);
            const brokenPercent = Math.round((broken/total)*100);
            
            summaryDiv.innerHTML = `
                <div>
                    <span class="working-count">✅ ${working} Working (${workingPercent}%)</span>
                    <span class="broken-count">❌ ${broken} Broken (${brokenPercent}%)</span>
                    <span>📊 ${tested}/${total} Tested</span>
                </div>
            `;
            
            document.title = `Testing ${tested}/${total} - ${working} ✅ ${broken} ❌`;
            
            if (tested === total) {
                filtersDiv.style.display = 'block';
                document.title = `Results: ${working} ✅ ${broken} ❌ - Country Images Test`;
            }
        }

        function filterResults(filter) {
            currentFilter = filter;
            const allDivs = document.querySelectorAll('.country-test');
            
            allDivs.forEach(div => {
                if (filter === 'all') {
                    div.style.display = 'flex';
                } else if (filter === 'working' && div.classList.contains('working')) {
                    div.style.display = 'flex';
                } else if (filter === 'broken' && div.classList.contains('broken')) {
                    div.style.display = 'flex';
                } else {
                    div.style.display = 'none';
                }
            });
        }
    </script>
